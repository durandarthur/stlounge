# Builds and tests on every push and pull request, and builds the AppImage and the
# Flatpak bundle. On a version tag (v1.2.3) both are attached to that tag's GitHub
# release (the release is created if it doesn't exist yet).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    # Ubuntu 22.04 has glibc 2.35: the AppImage runs on distributions that old or newer.
    # (Built on an up-to-date Arch, it would need the newest glibc.)
    container: ubuntu:22.04
    steps:
      - name: Install build tools and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates file \
            libsdl2-dev libpulse-dev nlohmann-json3-dev libegl-dev libgles-dev \
            libegl-mesa0 libgl1-mesa-dri

      - uses: actions/checkout@v7

      # GPU tests run on Mesa's software renderer (no GPU on the runner).
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Build the AppImage
        run: packaging/build-appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: AppImage
          path: build-appimage/*.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    # Flathub's image with the runtime the manifest uses already installed.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: echo "version=$(sed -n 's/^set(APP_VERSION *"\(.*\)")$/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      # The bundle points at Flathub for the runtime, so installing it fetches that too.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.durandarthur.stlounge.yml
          bundle: stlounge-${{ steps.version.outputs.version }}-x86_64.flatpak
          artifact-name: Flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release and attach files
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach the AppImage and Flatpak to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.AppImage
            dist/*.flatpak
          fail_on_unmatched_files: true
