# Builds and tests on every push and pull request, and builds the AppImage.
# On a version tag (v1.2.3) the AppImage is attached to that tag's GitHub release
# (the release is created if it doesn't exist yet).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to attach the AppImage to a release

jobs:
  appimage:
    runs-on: ubuntu-latest
    # Ubuntu 22.04 has glibc 2.35: the AppImage runs on distributions that old or newer.
    # (Built on an up-to-date Arch, it would need the newest glibc.)
    container: ubuntu:22.04
    steps:
      - name: Install build tools and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates file \
            libsdl2-dev libpulse-dev nlohmann-json3-dev libegl-dev libgles-dev \
            libegl-mesa0 libgl1-mesa-dri

      - uses: actions/checkout@v7

      # GPU tests run on Mesa's software renderer (no GPU on the runner).
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Build the AppImage
        run: packaging/build-appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: AppImage
          path: build-appimage/*.AppImage
          if-no-files-found: error

      - name: Attach the AppImage to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build-appimage/*.AppImage
          fail_on_unmatched_files: true
